name: OSV-Scanner

# Looks up the locked dependencies (Cargo.lock, fuzz/Cargo.lock) in the OSV database, which also
# covers advisories that are not in RustSec, and reports them in the Security tab. Runs on pull
# requests and on main, and weekly because new advisories appear without any change here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 3 * * 1" # Every Monday at 03:40 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  scan:
    name: OSV-Scanner
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --recursive
        ./

name: Job - Compatibility

# The Rust counterpart of a multi-runtime check: the suite must pass on every supported OS and
# toolchain (including the declared MSRV), every Cargo feature must build alone and in any
# combination, and the crate must still compile for WebAssembly.

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  matrix:
    name: test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, "1.85"]
    env:
      # Takes precedence over rust-toolchain.toml, which pins `stable`.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.toolchain }}-${{ matrix.os }}

      - name: Test
        run: cargo test --all-features

  features:
    name: feature powerset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install cargo-hack
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73
        with:
          tool: cargo-hack

      # One Cargo feature per module: each must compile alone and with any other. The full
      # powerset is O(2^features) and would take longer every time a module is added (8192
      # combinations already, 14m41s in CI as of 13 features); depth 2 is O(features^2) and
      # catches the same class of bug (two features that don't compile together) in a couple of
      # minutes. Combinations of up to 3 features still run, sharded, in compat-full.yml (weekly).
      - name: Every feature combination compiles (up to 2 at a time)
        run: cargo hack check --feature-powerset --no-dev-deps --depth 2

      - name: Every feature passes its tests alone
        run: cargo hack test --each-feature

  wasm:
    name: wasm (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}

      - name: Check
        run: cargo check --lib --all-features --target ${{ matrix.target }}

  minimal-versions:
    name: minimal dependency versions
    runs-on: ubuntu-latest
    # Informational: dependency lower bounds are only enforced once the crate has runtime
    # dependencies of its own.
    continue-on-error: true
    env:
      # Takes precedence over rust-toolchain.toml, which pins `stable` (no `-Z` flags there).
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Resolve to the minimal allowed versions
        run: cargo update -Z direct-minimal-versions

      - name: Test
        run: cargo test --all-features

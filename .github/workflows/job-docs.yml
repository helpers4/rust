name: Job - Docs

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      # RUSTDOCFLAGS=-D warnings turns broken intra-doc links and bare URLs into errors.
      - name: Build the documentation
        run: cargo doc --no-deps --all-features

      # Every rustdoc example is a smoke test of the public API.
      - name: Run the documentation examples
        run: cargo test --all-features --doc

name: Job - Compatibility (deep powerset)

# The deeper counterpart of job-compat.yml's depth-2 check: every combination of up to 3 Cargo
# features, not just every pair. The unbounded powerset is 2^features (over 268 million
# combinations at 28 features), which no amount of sharding makes feasible, so the depth is
# capped; the count still grows as features^3, which is why it is sharded (a partition k/n splits
# the combinations across jobs) and kept off the pull request path. See compat-full.yml for the
# schedule and the shard count.

on:
  workflow_call:
    inputs:
      partition:
        required: true
        type: string
        description: "'k/n' (1-based k) to run one slice of the deep powerset."

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  powerset:
    name: powerset (${{ inputs.partition }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: powerset-${{ inputs.partition }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: cargo-hack

      - name: Every combination of up to 3 features compiles (this shard)
        run: cargo hack check --feature-powerset --no-dev-deps --depth 3 --partition ${{ inputs.partition }}

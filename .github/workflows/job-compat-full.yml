name: Job - Compatibility (full powerset)

# The exhaustive counterpart of job-compat.yml's depth-2 check: every combination of Cargo
# features, not just every pair. O(2^features), so it is sharded (a partition k/n splits the
# combinations across jobs) and kept off the pull request path; see compat-full.yml for the
# schedule and the shard count.

on:
  workflow_call:
    inputs:
      partition:
        required: true
        type: string
        description: "'k/n' (1-based k) to run one slice of the full powerset."

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  powerset:
    name: powerset (${{ inputs.partition }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: powerset-${{ inputs.partition }}

      - name: Install cargo-hack
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: cargo-hack

      - name: Every feature combination compiles (this shard)
        run: cargo hack check --feature-powerset --no-dev-deps --partition ${{ inputs.partition }}

name: Compatibility (deep powerset)

# Every combination of up to 3 Cargo features (the pull request path in job-compat.yml checks
# pairs), sharded across parallel jobs. Weekly and on demand, not on every push: this is a deeper
# safety net on top of the pull request checks, not something that needs to be instant.
#
# The unbounded powerset is 2^features: 8192 combinations at 13 features took 14m41s on one
# runner, and at 28 features it is over 268 million, which sharding cannot save. Depth 3 is about
# features^3 / 6 (3 700 combinations at 28 features); raise the depth or the shard count only
# with the arithmetic in hand.

on:
  schedule:
    - cron: "0 4 * * 1" # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powerset:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    uses: ./.github/workflows/job-compat-full.yml
    with:
      partition: ${{ matrix.shard }}/8

name: Release

# Releases helpers4 with helpers4/action-release: from `main`, after the same gates as a pull
# request, it computes the version from the Conventional Commits, writes it in Cargo.toml and
# Cargo.lock, adds the section of the version to CHANGELOG.md (a human summary written under
# `## [Unreleased]` leads it), dry-runs `cargo publish`, pushes the signed release commit to `main`
# (as helpers4-bot, which bypasses the ruleset), tags it, publishes to crates.io with trusted
# publishing and publishes the GitHub release. The steps after the action attest the packaged
# crate and attach the signature and the SBOM to that release.
#
# api-since.json: `scripts/update-api-since.py next` records the items added since the last tag as
# "next" (cargo public-api, nightly), and the action replaces "next" by the version.
#
# Resumable: if a run failed after the release commit, run it again (or `bump: resume`): the action
# publishes only what crates.io does not serve yet, and the steps below finish the release.
#
# Authentication is crates.io trusted publishing: a short-lived token minted from the GitHub OIDC
# identity of this run, so no secret is stored. The Trusted Publisher is configured on crates.io
# for the crate (repository helpers4/rust, workflow release.yml, environment crates-io).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "bump"
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha, beta, rc, resume]
      dry-run:
        description: "dry-run"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository and branch guard
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$GITHUB_REPOSITORY" != "helpers4/rust" ]; then
            echo "::error::Releases only run from helpers4/rust (this is $GITHUB_REPOSITORY)."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real release only runs from main (this is $GITHUB_REF). Use dry-run elsewhere."
            exit 1
          fi

  # The same gates as a pull request, on the exact commit that will be released.
  lint:
    needs: guard
    uses: ./.github/workflows/job-lint.yml

  tests:
    needs: guard
    uses: ./.github/workflows/job-tests.yml

  compat:
    needs: guard
    uses: ./.github/workflows/job-compat.yml

  docs:
    needs: guard
    uses: ./.github/workflows/job-docs.yml

  security:
    needs: guard
    uses: ./.github/workflows/job-security.yml

  release:
    needs: [guard, lint, tests, compat, docs, security]
    runs-on: ubuntu-latest
    # The name must match the Trusted Publisher configured on crates.io. It can also carry required
    # reviewers (repository Settings -> Environments) so nothing is published without an approval.
    environment: crates-io
    permissions:
      contents: write # the release commit, the tag, the GitHub release
      id-token: write # trusted publishing and build provenance
      attestations: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node (runs the release action)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Install cargo-public-api
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-public-api

      - name: Install the nightly toolchain (rustdoc JSON)
        run: rustup toolchain install nightly --profile minimal

      # The items added since the last tag get "next" in api-since.json; the release replaces it by
      # the version. On a clean tree: `cargo public-api diff` checks out the previous tag.
      - name: Record the new public items in api-since.json
        run: python3 scripts/update-api-since.py next

      - name: Every public item has an api-since.json entry
        run: python3 scripts/coherency.py --api-since

      - name: Release
        id: release
        uses: helpers4/action-release@ff5478af5ec4d768ad896e8539a42cb2bed15803 # v0.4.4
        with:
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          since-json: api-since.json
          app-id: ${{ vars.HELPERS4_BOT_ID }}
          app-key: ${{ secrets.HELPERS4_BOT_KEY }}

      # `cargo publish` leaves the packaged crate in target/package.
      - name: Attest the packaged crate
        id: attest
        if: ${{ !inputs.dry-run && hashFiles('target/package/*.crate') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate

      # The attestation lives in GitHub's attestation store; a copy of its Sigstore bundle next to
      # the .crate on the release page is what tools that only read release assets (OpenSSF
      # Scorecard's Signed-Releases check) can see. Verify with:
      #   gh attestation verify helpers4-X.Y.Z.crate --repo helpers4/rust
      - name: Keep the signature bundle next to the crate
        if: ${{ steps.attest.outcome == 'success' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "target/package/helpers4-$VERSION.crate.sigstore.json"
          ls -l target/package/

      - name: Install cargo-cyclonedx
        if: ${{ steps.attest.outcome == 'success' }}
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32
        with:
          tool: cargo-cyclonedx

      # Trivial while the crate has zero third-party dependencies by default (0 components), but
      # it is the machine-readable proof of that, and it will actually list something once a
      # module with an optional dependency is enabled at build time.
      - name: Generate the SBOM (CycloneDX)
        if: ${{ steps.attest.outcome == 'success' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cargo cyclonedx --format json --all-features --override-filename "helpers4-$VERSION.cdx"
          mv "helpers4-$VERSION.cdx.json" target/package/

      - name: Attach the crate, its signature and the SBOM to the release
        if: ${{ steps.attest.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" target/package/*.crate target/package/*.sigstore.json target/package/*.cdx.json --clobber

  # Tells the website to regenerate its Rust docs from this release's tag (helpers4/website,
  # on-rust-release.yml checks the tag out and reads it). Best-effort: a failure here never fails
  # the release; run "On Rust Release" on the website by hand with the version instead. It needs the
  # tag, so it runs once `publish` (which creates it) is done.
  trigger-website-docs:
    needs: release
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: trigger-website-docs-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Trigger the website docs update
        uses: helpers4/action/dispatch-with-fallback@c66ddc3b4c9c46c4c3f4b9a8c87e16bb188321bd
        with:
          target-owner: helpers4
          target-repo: website
          event-type: rust-release
          payload: '{"version": "${{ needs.release.outputs.version }}"}'
          app-id: ${{ vars.TRIGGANATOR_ID }}
          app-private-key: ${{ secrets.TRIGGANATOR_KEY }}
          fallback-app-id: ${{ vars.PUSHINATOR_ID }}
          fallback-app-private-key: ${{ secrets.PUSHINATOR_KEY }}

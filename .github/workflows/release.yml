name: Release

# Publishes the version that is in Cargo.toml on `main` to crates.io, then tags it and creates
# the GitHub release. The version bump itself goes through a normal PR (`chore(release): 🔖 X.Y.Z`,
# CHANGELOG.md generated with `git cliff --tag vX.Y.Z`), so this workflow never commits.
#
# Resumable: if a run published to crates.io but failed afterwards (tag, release), run it again —
# it sees the version is already on crates.io and only finishes the remaining steps.
#
# Authentication is crates.io trusted publishing: a short-lived token minted from the GitHub OIDC
# identity of this run, so no secret is stored. The Trusted Publisher is configured on crates.io
# for the crate (repository helpers4/rust, workflow release.yml, environment crates-io).

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "dry-run"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      published: ${{ steps.published.outputs.published }}
      tagged: ${{ steps.tagged.outputs.tagged }}
    steps:
      - name: Repository and branch guard
        run: |
          if [ "$GITHUB_REPOSITORY" != "helpers4/rust" ]; then
            echo "::error::Releases only run from helpers4/rust (this is $GITHUB_REPOSITORY)."
            exit 1
          fi
          if [ "${{ inputs.dry-run }}" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real release only runs from main (this is $GITHUB_REF). Use dry-run elsewhere."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Read the version
        id: meta
        run: |
          VERSION=$(sed -nE '0,/^version = "([^"]+)"/s//\1/p' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"
          # The release notes come from CHANGELOG.md: refuse to release without them.
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Generate it: git cliff --tag v$VERSION -o CHANGELOG.md"
            exit 1
          fi

      - name: Already on crates.io?
        id: published
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: helpers4-release' \
            "https://crates.io/api/v1/crates/helpers4/${{ steps.meta.outputs.version }}")
          if [ "$CODE" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "helpers4 ${{ steps.meta.outputs.version }} is already on crates.io: only tag and release remain."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already tagged?
        id: tagged
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  # The same gates as a pull request, on the exact commit that will be released.
  lint:
    needs: guard
    uses: ./.github/workflows/job-lint.yml

  tests:
    needs: guard
    uses: ./.github/workflows/job-tests.yml

  compat:
    needs: guard
    uses: ./.github/workflows/job-compat.yml

  docs:
    needs: guard
    uses: ./.github/workflows/job-docs.yml

  security:
    needs: guard
    uses: ./.github/workflows/job-security.yml

  publish:
    needs: [guard, lint, tests, compat, docs, security]
    runs-on: ubuntu-latest
    # The name must match the Trusted Publisher configured on crates.io. It can also carry required
    # reviewers (repository Settings -> Environments) so nothing is published without an approval.
    environment: crates-io
    permissions:
      contents: write # tag + GitHub release
      id-token: write # trusted publishing and build provenance
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # Catches a release-prep PR that bumped the version but forgot
      # `python3 scripts/update-api-since.py X.Y.Z` for a helper added this round.
      - name: Every public item has an api-since.json entry
        run: python3 scripts/coherency.py --api-since

      - name: Package
        run: |
          cargo package --locked
          ls -l target/package/*.crate

      - name: Verify the publication (dry run)
        if: inputs.dry-run
        run: cargo publish --dry-run --locked

      - name: Authenticate to crates.io (trusted publishing)
        id: auth
        if: ${{ !inputs.dry-run && needs.guard.outputs.published != 'true' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      - name: Publish to crates.io
        if: ${{ !inputs.dry-run && needs.guard.outputs.published != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Wait for crates.io to serve the new version
        if: ${{ !inputs.dry-run }}
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: helpers4-release' \
              "https://crates.io/api/v1/crates/helpers4/${{ needs.guard.outputs.version }}")
            [ "$CODE" = "200" ] && { echo "Visible on crates.io."; exit 0; }
            sleep 10
          done
          echo "::error::helpers4 ${{ needs.guard.outputs.version }} is not visible on crates.io after 5 minutes."
          exit 1

      - name: Attest the packaged crate
        id: attest
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate

      # The attestation lives in GitHub's attestation store; a copy of its Sigstore bundle next to
      # the .crate on the release page is what tools that only read release assets (OpenSSF
      # Scorecard's Signed-Releases check) can see. Verify with:
      #   gh attestation verify helpers4-X.Y.Z.crate --repo helpers4/rust
      - name: Keep the signature bundle next to the crate
        if: ${{ !inputs.dry-run }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "target/package/helpers4-${{ needs.guard.outputs.version }}.crate.sigstore.json"
          ls -l target/package/

      - name: Install cargo-cyclonedx
        if: ${{ !inputs.dry-run }}
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: cargo-cyclonedx

      # Trivial while the crate has zero third-party dependencies by default (0 components), but
      # it is the machine-readable proof of that, and it will actually list something once a
      # module with an optional dependency is enabled at build time.
      - name: Generate the SBOM (CycloneDX)
        if: ${{ !inputs.dry-run }}
        run: |
          cargo cyclonedx --format json --all-features \
            --override-filename "helpers4-${{ needs.guard.outputs.version }}.cdx"
          mv "helpers4-${{ needs.guard.outputs.version }}.cdx.json" target/package/

      - name: Extract the release notes
        if: ${{ !inputs.dry-run }}
        run: |
          awk -v v="${{ needs.guard.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      # `gh release create --target` creates the tag on the exact commit that was tested.
      - name: Create the tag and the GitHub release
        if: ${{ !inputs.dry-run && needs.guard.outputs.tagged != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.guard.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ needs.guard.outputs.version }}" \
            --notes-file release-notes.md \
            target/package/*.crate \
            target/package/*.sigstore.json \
            target/package/*.cdx.json

      # Resuming a release whose tag exists already: make sure the signature and SBOM are on it too.
      - name: Attach the signature and SBOM to the existing release
        if: ${{ !inputs.dry-run && needs.guard.outputs.tagged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ needs.guard.outputs.version }}" \
            target/package/*.sigstore.json target/package/*.cdx.json --clobber

      - name: Summary
        run: |
          {
            echo "### helpers4 ${{ needs.guard.outputs.version }}"
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "Dry run: nothing was published, tagged or released."
            else
              echo "Published to crates.io: https://crates.io/crates/helpers4/${{ needs.guard.outputs.version }}"
              echo "Release: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.guard.outputs.version }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Tells the website to regenerate its Rust docs from this release's tag (helpers4/website,
  # on-rust-release.yml checks the tag out and reads it). Best-effort: a failure here never fails
  # the release; run "On Rust Release" on the website by hand with the version instead. It needs the
  # tag, so it runs once `publish` (which creates it) is done.
  trigger-website-docs:
    needs: [guard, publish]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: trigger-website-docs-${{ needs.guard.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Trigger the website docs update
        uses: helpers4/action/dispatch-with-fallback@c66ddc3b4c9c46c4c3f4b9a8c87e16bb188321bd
        with:
          target-owner: helpers4
          target-repo: website
          event-type: rust-release
          payload: '{"version": "${{ needs.guard.outputs.version }}"}'
          app-id: ${{ vars.TRIGGANATOR_ID }}
          app-private-key: ${{ secrets.TRIGGANATOR_KEY }}
          fallback-app-id: ${{ vars.PUSHINATOR_ID }}
          fallback-app-private-key: ${{ secrets.PUSHINATOR_KEY }}

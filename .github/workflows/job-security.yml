name: Job - Security Audit

# Also runs by itself every day: new RustSec advisories, yanked crates and license changes appear
# without any change in this repository, so the pull request audit alone would only see them on
# the next pull request.
on:
  workflow_call:
  schedule:
    - cron: "0 5 * * *" # Every day at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-deny

      # Advisories (RustSec), yanked crates, licenses, bans and sources, per deny.toml.
      - name: Run cargo-deny
        run: cargo deny check

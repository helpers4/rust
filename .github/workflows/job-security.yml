name: Job - Security Audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cargo-deny
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73
        with:
          tool: cargo-deny

      # Advisories (RustSec), yanked crates, licenses, bans and sources, per deny.toml.
      - name: Run cargo-deny
        run: cargo deny check

[package]
name = "helpers4"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "LGPL-3.0-or-later"
authors = ["baxyz <craft@baxyz.dev>"]
repository = "https://github.com/helpers4/rust"
homepage = "https://helpers4.dev"
description = "General-purpose Rust helpers, one crate, one feature per module (string, array, ...)"
keywords = ["helpers", "utilities", "string"]
categories = ["algorithms"]
# Ship the sources, benchmarks and the human/AI entry points; keep CI and tooling config out.
include = ["src/**", "benches/**", "Cargo.toml", "LICENSE", "README.md", "SECURITY.md", "llms.txt"]

[features]
default = ["array", "env", "hex", "string"]
# One feature per module: `default-features = false, features = ["string"]`
# compiles only what is used.
array = []
env = []
hex = []
string = []

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
proptest = "1"

[[bench]]
name = "array"
harness = false
required-features = ["array"]

[[bench]]
name = "hex"
harness = false
required-features = ["hex"]

[[bench]]
name = "string"
harness = false
required-features = ["string"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# cargo-mutants configuration.
# Mutants are only generated in the implementation files: test, property-test and benchmark
# files are never mutated (their `mod tests;` declarations are #[cfg(test)]).
examine_globs = ["src/**/*.rs"]
exclude_globs = ["src/**/*.test.rs", "src/**/*.spec.rs", "src/**/*.bench.rs"]
# Property tests are slow under mutation: bound each mutant's run.
timeout_multiplier = 3.0
minimum_test_timeout = 60

# Equivalent mutants (the mutated program behaves identically, so no test can catch them):
# `(high << 4) | low` — the two nibbles never overlap, so `|` and `^` give the same byte.
#
# `ExpiringMap::evict_expired` skips the sweep while `now` is below the earliest expiry. Making the
# guard always true only sweeps needlessly: the result is identical, so no test can observe it.
#
# Mutants that make a loop run forever: the tests cannot fail, they can only hang until the
# timeout, which costs a minute each and makes cargo-mutants exit non-zero. `% -> /` in the Euclid
# loop of `gcd` never reaches a zero remainder; `decode_entity -> Some((_, 0))` makes
# `unescape_html` consume nothing forever. A hang is detected, so these are not a test gap.
#
# `Hsl::to_rgb` picks a formula per 60 degree sector; at the exact boundary between two sectors both
# formulas give the same color, so `<` or `<=` on the boundary cannot be told apart.
#
# `ThreadWaker::wake` unparks the thread blocked in `block_on`: without it that thread sleeps for
# ever, so the mutant can only end in the timeout (the test that needs another thread to wake it is
# what catches it).
#
# `min_max` only ever replaces `min`/`max` with a value equal to it (`item == min`/`item == max`),
# so making the comparison non-strict (`<=`/`>=`) reassigns the same value and changes nothing.
#
# `cubic_bezier_at` bisects `x(s) = t` 40 times: `<` or `<=` only differs when `x(middle) == t`
# exactly, where the search converges to the same point from the other side.
# `settling_time_ms` doubles `end` until the motion is at rest, then walks back from it: starting
# from any `end` past the settling time gives the same result, so doubling by `end += 2` instead
# of `end *= 2` only changes how many steps it takes; `last <= 0` or `last < 0` differ at
# `last == 0` only, where the displacement is 1 and the walk stops anyway, and `< REST`, `<= REST`,
# `>= REST` or `> REST` only differ when the envelope or the displacement equals the threshold
# exactly.
#
# `Rng::below` redraws while `low < threshold`: `<` or `<=` only differs when `low == threshold`
# exactly (one draw in 2^64), and `<` or `<=` on `low < bound` only skips a threshold computation
# that cannot reject anything. `simplify_polyline` starts each scan at `first + 1`; starting at
# `first` instead adds the point at distance 0, which is never farther than the tolerance.
#
# Mutants that make a loop run forever (the tests cannot fail, they can only hang until the
# timeout): the loop controls of `resolve_inputs`, `stops_at`, `Rng::below`, `Rng::next_u64` (every
# `below` redraws for ever when it returns 0), `alphanumeric_with`, `short_id_with`, and
# `compare_natural` (a `take_number` that consumes nothing).
#
# `Hsb::to_rgb` picks a formula per 60 degree sector, like `Hsl::to_rgb`: at the exact boundary
# both formulas give the same color. `stretch_order` and `weight_order` list the values CSS tries
# in order and take the first one a face has: `>` or `<` made non-strict only repeats the wanted
# value in the list. In the font arc conversion, `lambda > 1.0` scales the radii by
# `sqrt(lambda)`, which is 1 at exactly 1, and `delta` is never exactly 0 (the end points differ).
# `load` in the WOFF reader tests `stored < size` after `stored == size` was handled, so `<=` is
# the same test.
#
# Mutants that make a loop run forever in the font inflate: the length-run counts of
# `dynamic_codes` (`3 + bits` as `3 * bits` or `3 - bits` is zero for some streams, and the loop
# that fills the code lengths then never advances).
exclude_re = [
  "replace \\| with \\^ in decode_into",
  "replace match guard now >= earliest with true in .*evict_expired",
  "replace % with / in gcd",
  "replace decode_entity -> .* with Some\\(\\(Default::default\\(\\), 0\\)\\)",
  "replace < with <= in min_max",
  "replace > with >= in min_max",
  "replace < with <= in Hsl::to_rgb",
  "replace <impl Wake for ThreadWaker>::wake with \\(\\)",
  "replace < with <= in cubic_bezier_at",
  "replace \\*= with \\+= in settling_time_ms",
  "replace < with <= in settling_time_ms",
  "replace <= with < in settling_time_ms",
  "replace >= with > in settling_time_ms",
  "replace < with <= in Rng::below",
  "replace \\+ with \\* in simplify_polyline",
  "replace \\+= with \\*= in (resolve_inputs|stops_at)",
  "replace Rng::next_u64 -> u64 with 0",
  "replace < with > in Rng::below",
  "replace \\* with / in Rng::below",
  "replace [-%] with / in short_id_with",
  "replace < with (==|<=|>) in short_id_with",
  "replace < with (==|>) in alphanumeric_with",
  "replace match guard x.is_ascii_digit\\(\\) && y.is_ascii_digit\\(\\) with true in compare_natural",
  "replace take_number -> .* with",
  "replace < with <= in Hsb::to_rgb",
  "replace [<>] with [<>]= in (stretch_order|weight_order)",
  "replace < with <= in load",
  "replace > with >= in arc_to_cubics",
  "replace < with <= in arc_to_cubics",
  "replace \\+ with [-*] in dynamic_codes",
]

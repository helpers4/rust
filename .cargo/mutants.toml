# cargo-mutants configuration.
# Mutants are only generated in the implementation files: test, property-test and benchmark
# files are never mutated (their `mod tests;` declarations are #[cfg(test)]).
examine_globs = ["src/**/*.rs"]
exclude_globs = ["src/**/*.test.rs", "src/**/*.spec.rs", "src/**/*.bench.rs"]
# Property tests are slow under mutation: bound each mutant's run.
timeout_multiplier = 3.0
minimum_test_timeout = 60

# Equivalent mutants (the mutated program behaves identically, so no test can catch them):
# `(high << 4) | low` — the two nibbles never overlap, so `|` and `^` give the same byte.
#
# `ExpiringMap::evict_expired` skips the sweep while `now` is below the earliest expiry. Making the
# guard always true only sweeps needlessly: the result is identical, so no test can observe it.
#
# Mutants that make a loop run forever: the tests cannot fail, they can only hang until the
# timeout, which costs a minute each and makes cargo-mutants exit non-zero. `% -> /` in the Euclid
# loop of `gcd` never reaches a zero remainder; `decode_entity -> Some((_, 0))` makes
# `unescape_html` consume nothing forever. A hang is detected, so these are not a test gap.
#
# `min_max` only ever replaces `min`/`max` with a value equal to it (`item == min`/`item == max`),
# so making the comparison non-strict (`<=`/`>=`) reassigns the same value and changes nothing.
exclude_re = [
  "replace \\| with \\^ in decode_into",
  "replace match guard now >= earliest with true in .*evict_expired",
  "replace % with / in gcd",
  "replace decode_entity -> .* with Some\\(\\(Default::default\\(\\), 0\\)\\)",
  "replace < with <= in min_max",
  "replace > with >= in min_max",
]

[graph]
exclude-dev = true

[licenses]
allow = [
  "LGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "ISC",
  "BSD-3-Clause",
  "CC0-1.0",
]
confidence-threshold = 0.8

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
